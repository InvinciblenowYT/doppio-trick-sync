
name: Mirror to separate repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts

          git config core.sshCommand \
            "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

          git remote add mirror \
            git@github.com:InvinciblenowYT/doppio-trick-sync.git

          git push mirror HEAD:refs/heads/main
